[project]
name = "restaurant-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manpreets1002", email = "bhatia.manpreet1224@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "asyncpg==0.32.0",
    "bcrypt==5.0.0",
    "fastapi==0.159.1",
    "greenlet==3.5.6",
    "httpx==0.28.1",
    "openai==3.36.0",
    "pydantic-settings==2.16.1",
    "pyjwt==2.15.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "sqlalchemy==2.1.6",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[project.scripts]
restaurant-management-system = "restaurant_management_system:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
